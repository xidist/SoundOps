apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "soundops.fullname" . }}-test"
  labels:
    {{- include "soundops.selectorLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
      args:
        - "--spider"
        - "--timeout=10"
        - "http://{{ include "soundops.fullname" . }}:{{ .Values.service.port }}/healthz"
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 10001
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
