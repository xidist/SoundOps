<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoundOps</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: #ecf4ff;
      background: #07111f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 20%, #143b5e 0, transparent 34rem),
        radial-gradient(circle at 90% 80%, #34225c 0, transparent 32rem),
        #07111f;
    }
    main {
      width: min(760px, calc(100% - 32px));
      padding: 34px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      background: rgba(8, 20, 36, .84);
      box-shadow: 0 28px 90px rgba(0,0,0,.38);
      backdrop-filter: blur(12px);
    }
    h1 { font-size: clamp(2.3rem, 7vw, 4.5rem); margin: 0; letter-spacing: -.06em; }
    .eyebrow { color: #8dd9ff; text-transform: uppercase; letter-spacing: .18em; font-size: .75rem; font-weight: 800; }
    .subtitle { color: #afc2d8; max-width: 60ch; line-height: 1.6; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      margin: 10px 0 22px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #f0a84d; }
    .dot.ready { background: #4de39d; box-shadow: 0 0 18px #4de39d; }
    form {
      display: grid;
      gap: 14px;
      padding: 20px;
      border-radius: 18px;
      background: rgba(255,255,255,.055);
    }
    input[type=file] {
      width: 100%;
      padding: 18px;
      border: 1px dashed rgba(255,255,255,.25);
      border-radius: 14px;
      background: rgba(255,255,255,.03);
      color: #dcecff;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      background: linear-gradient(135deg, #76d5ff, #a88cff);
      color: #07111f;
    }
    button:disabled { opacity: .55; cursor: progress; }
    #message { color: #ffd28c; min-height: 1.5em; }
    #results { display: grid; gap: 12px; margin-top: 22px; }
    .result {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) 3fr 64px;
      gap: 12px;
      align-items: center;
    }
    .bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,.09); overflow: hidden; }
    .fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #76d5ff, #a88cff); }
    code { color: #93dfff; }
    footer { margin-top: 24px; color: #7890aa; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Kubernetes-ready audio inference</div>
    <h1>SoundOps</h1>
    <p class="subtitle">
      Upload an audio clip. A Hugging Face Audio Spectrogram Transformer
      returns the top sound-event labels while Prometheus tracks requests,
      failures, file sizes, and inference latency.
    </p>
    <div class="status"><span id="dot" class="dot"></span><span id="statusText">Checking model…</span></div>
    <form id="uploadForm">
      <input id="audioFile" type="file" accept="audio/*,.wav,.mp3,.flac,.ogg,.m4a" required>
      <button id="submitButton" type="submit">Classify audio</button>
      <div id="message"></div>
    </form>
    <section id="results" aria-live="polite"></section>
    <footer>
      API docs: <code>/docs</code> · Readiness: <code>/readyz</code> · Metrics: <code>/metrics</code>
    </footer>
  </main>
  <script>
    const form = document.getElementById("uploadForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const results = document.getElementById("results");
    const dot = document.getElementById("dot");
    const statusText = document.getElementById("statusText");

    async function checkReady() {
      try {
        const response = await fetch("/readyz");
        const body = await response.json();
        if (response.ok) {
          dot.classList.add("ready");
          statusText.textContent = `Ready · ${body.model}`;
          return;
        }
        statusText.textContent = "Model is downloading/loading…";
      } catch {
        statusText.textContent = "Service unavailable";
      }
      setTimeout(checkReady, 3000);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = document.getElementById("audioFile").files[0];
      if (!file) return;

      button.disabled = true;
      message.textContent = "Running inference…";
      results.innerHTML = "";

      const data = new FormData();
      data.append("file", file);

      try {
        const response = await fetch("/predict", { method: "POST", body: data });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || "Prediction failed");

        message.textContent = `Completed in ${body.inference_seconds}s using ${body.model}`;
        results.innerHTML = body.predictions.map((item) => {
          const pct = Math.round(item.score * 100);
          return `
            <div class="result">
              <strong>${item.label}</strong>
              <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
              <span>${pct}%</span>
            </div>`;
        }).join("");
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    checkReady();
  </script>
</body>
</html>
